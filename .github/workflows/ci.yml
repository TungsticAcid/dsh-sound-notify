name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install esbuild pinned to the version used for lib/
        run: npm install --no-save esbuild@0.23.0
      - name: Show esbuild version
        run: node -e "console.log('esbuild', require('esbuild/package.json').version)"
      - name: Build lib/
        run: node build.mjs
      - name: Offline simulation (vm harness)
        run: node test/simulate.cjs
      - name: Report committed build drift (informational)
        continue-on-error: true
        run: git diff --stat -- lib/
